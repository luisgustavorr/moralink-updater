name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install dependencies (Fyne + cross-compiler)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc libgl1-mesa-dev xorg-dev \
            gcc-mingw-w64-x86-64

      - name: Build Linux
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=1 \
          go build -ldflags "-X main.Version=${{ github.ref_name }} -s -w" \
            -o dist/moralink-updater-linux-amd64 .

      - name: Build Windows
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=1 \
          CC=x86_64-w64-mingw32-gcc \
          go build -ldflags "-X main.Version=${{ github.ref_name }} -s -w" \
            -o dist/moralink-updater-windows-amd64.exe .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/moralink-updater-linux-amd64
            dist/moralink-updater-windows-amd64.exe
          generate_release_notes: true